<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ein kleiner Taschenrechner als JavaScript-Browseranwendung.">
    <title>Kleiner Taschenrechner</title>
    <link rel="stylesheet" href="../../language.css">
    <script src="../../language.js?v=3" defer></script>
    <style>
        :root {
            color-scheme: dark;
            --background: #101827;
            --surface: #182338;
            --surface-highlight: #223252;
            --text: #f4f7fb;
            --muted: #aab8ce;
            --accent: #72d6c9;
            --accent-dark: #0d3d3a;
            --error: #ffb4ab;
        }

        * { box-sizing: border-box; }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
            color: var(--text);
            background: radial-gradient(circle at top right, #23466a 0, transparent 34rem), var(--background);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        main {
            width: min(620px, 100%);
            margin: auto;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 1.25rem;
            background: linear-gradient(145deg, var(--surface-highlight), var(--surface));
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.22);
        }

        .eyebrow {
            margin: 0 0 0.75rem;
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 { margin: 0 0 0.75rem; font-size: clamp(2rem, 7vw, 3.5rem); }
        .intro { margin: 0 0 2rem; color: var(--muted); line-height: 1.6; }

        form { display: flex; gap: 0.75rem; }

        input,
        button {
            min-height: 3rem;
            border: 0;
            border-radius: 0.65rem;
            font: inherit;
        }

        input {
            min-width: 0;
            flex: 1;
            padding: 0.75rem 1rem;
            color: var(--text);
            background: rgba(0, 0, 0, 0.25);
        }

        input:focus-visible,
        button:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 3px;
        }

        button {
            padding: 0.75rem 1rem;
            color: var(--accent-dark);
            background: var(--accent);
            cursor: pointer;
            font-weight: 700;
        }

        button:hover { background: #9be8df; }

        .output {
            min-height: 3rem;
            margin-top: 1.5rem;
            padding: 0.9rem 1rem;
            border-radius: 0.65rem;
            background: rgba(0, 0, 0, 0.2);
            line-height: 1.4;
        }

        #result { color: var(--accent); font-weight: 700; }
        #error { color: var(--error); }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--muted);
            text-underline-offset: 0.2em;
        }

        @media (max-width: 420px) {
            form { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>

<body>
    <main>
        <p class="eyebrow">TypeScript-Übung</p>
        <h1>Kleiner Taschenrechner</h1>
        <p class="intro">Gib eine Rechnung mit <code>+</code>, <code>-</code>, <code>*</code> oder <code>/</code> ein.</p>

        <form id="calculator-form">
            <label for="expression" hidden>Rechnung</label>
            <input id="expression" name="expression" type="text" inputmode="decimal" placeholder="z. B. 12 + 4 * 2" autocomplete="off" autofocus>
            <button type="submit">Berechnen</button>
        </form>

        <div class="output" aria-live="polite">
            <span id="result"></span>
            <span id="error"></span>
        </div>

        <a class="back-link" href="../../index.html">Zur Projektübersicht</a>
    </main>

    <script src="./Taschenrechner%20ONLINE.js"></script>
</body>

</html>
