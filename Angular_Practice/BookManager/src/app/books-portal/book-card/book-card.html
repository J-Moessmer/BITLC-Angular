@let b = book();
@let titleId = `title-${b.isbn}`;

<article class="book-card">
  <img
    [src]="b.imageUrl"
     alt="Buchcover"
    [aria-describedby]="titleId" >
  <header>
    <h2 [id]="titleId">{{ b.title }}</h2>
  </header>
  <div>
    @if (b.subtitle) {
      <p role="doc-subtitle">{{ b.subtitle }}</p>
    }
    ISBN: {{ b.isbn }}
  </div>
  <footer>
    <button type="button" class="secondary"  
    (click)="likeBook()">Like</button>
  </footer>
</article>
